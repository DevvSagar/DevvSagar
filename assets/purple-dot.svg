<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <defs>
    <radialGradient id="glow-purple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C084FC" stop-opacity="1"/>
      <stop offset="50%" stop-color="#A855F7" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#7E22CE" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Fast Outer Glow Pulse -->
  <circle cx="12" cy="12" r="10" fill="url(#glow-purple)">
    <animate attributeName="r" values="6;12;6" dur="0.65s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.2;1" dur="0.65s" repeatCount="indefinite"/>
  </circle>
  <!-- Inner Glow Ring -->
  <circle cx="12" cy="12" r="6" fill="#D8B4FE" opacity="0.8">
    <animate attributeName="r" values="4.5;8;4.5" dur="0.65s" repeatCount="indefinite"/>
  </circle>
  <!-- Sharp Core Solid Dot -->
  <circle cx="12" cy="12" r="4.5" fill="#A855F7"/>
</svg>
