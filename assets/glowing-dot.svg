<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF6A00" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#FF8C00" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#FFA500" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Outer Glow Pulse -->
  <circle cx="12" cy="12" r="10" fill="url(#glow)">
    <animate attributeName="r" values="7;11;7" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.9;0.25;0.9" dur="2s" repeatCount="indefinite"/>
  </circle>
  <!-- Inner Glow Ring -->
  <circle cx="12" cy="12" r="6" fill="#FF7A00" opacity="0.6">
    <animate attributeName="r" values="5;7.5;5" dur="2s" repeatCount="indefinite"/>
  </circle>
  <!-- Core Solid Dot -->
  <circle cx="12" cy="12" r="4.5" fill="#FF5500"/>
</svg>
